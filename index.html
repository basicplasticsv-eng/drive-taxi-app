<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoateTV & Radio Digital</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #ff4757;
      --accent-hover: #ff6b81;
      --text: #ffffff;
      --text-dim: #aaa;
      --border: #333;
      --success: #2ed573;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    nav {
      background-color: #0a0a0a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
    }

    nav .logo {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--accent);
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .view-content {
      display: none;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .view-content.active {
      display: grid;
    }

    #publicView {
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      #publicView { grid-template-columns: 2fr 1fr; }
    }

    .media-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .audio-container {
      margin-top: 15px;
      padding: 20px;
      background-color: #000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      font-size: 0.8em;
      background: var(--accent);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .btn-audio-toggle {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-audio-toggle:hover {
      background-color: var(--accent-hover);
    }

    .video-overlay-btn {
      position: absolute;
      bottom: 15px;
      right: 15px;
      z-index: 10;
    }

    #adminView { grid-template-columns: 1fr; gap: 20px; }

    @media (min-width: 768px) {
      #adminView.authenticated { grid-template-columns: 1fr 1fr; }
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: var(--text-dim); }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #2a2a2a;
      color: var(--text);
      box-sizing: border-box;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .file-item {
      padding: 10px;
      background: #2a2a2a;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 0.85em;
      word-break: break-all;
    }

    .auth-card { max-width: 400px; margin: 40px auto; width: 100%; }
    .admin-panel-content { display: none; width: 100%; gap: 20px; }
  </style>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://zvpgpqykgbrkcphhnhvx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5tq4snjI8q4AfrbBYgzrVw_UfoZw9vA';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let tvPlaylist = [];
    let radioPlaylist = [];
    let currentVideoIndex = 0;
    let currentRadioIndex = 0;
    let isAdminAuthenticated = false;

    window.switchTab = function(tabName) {
      document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      if(tabName === 'public') {
        document.getElementById('publicView').classList.add('active');
        document.getElementById('tabPublic').classList.add('active');
      } else {
        document.getElementById('adminView').classList.add('active');
        document.getElementById('tabAdmin').classList.add('active');
        if (isAdminAuthenticated) loadStorageFiles();
      }
    };

    window.toggleTvAudio = function() {
      const video = document.getElementById('tvPlayer');
      const btn = document.getElementById('tvAudioBtn');
      if (video.muted) {
        video.muted = false;
        btn.textContent = '🔊 Silenciar';
      } else {
        video.muted = true;
        btn.textContent = '🔇 Activar Sonido';
      }
    };

    window.toggleRadioAudio = function() {
      const audio = document.getElementById('radioPlayer');
      const btn = document.getElementById('radioAudioBtn');
      if (audio.muted) {
        audio.muted = false;
        localStorage.setItem('radioMuted', 'false');
        audio.play().catch(() => {});
        btn.textContent = '🔊 Silenciar';
      } else {
        audio.muted = true;
        localStorage.setItem('radioMuted', 'true');
        btn.textContent = '🔇 Activar Sonido';
      }
    };

    async function fetchTvPlaylist() {
      const { data, error } = await supabase.storage.from('videos').list();
      if (data && data.length > 0) {
        tvPlaylist = data.map(item => ({
          name: item.name,
          url: supabase.storage.from('videos').getPublicUrl(item.name).data.publicUrl
        }));
        playVideo(0);
      }
    }

    function playVideo(index) {
      if (tvPlaylist.length === 0) return;
      currentVideoIndex = index % tvPlaylist.length;
      const player = document.getElementById('tvPlayer');
      player.src = tvPlaylist[currentVideoIndex].url;
      player.play().catch(() => {});
    }

    async function fetchRadioPlaylist() {
      const { data, error } = await supabase.storage.from('audio').list();
      if (data && data.length > 0) {
        radioPlaylist = data.map(item => ({
          name: item.name,
          url: supabase.storage.from('audio').getPublicUrl(item.name).data.publicUrl
        }));
        
        const savedIndex = localStorage.getItem('radioTrackIndex');
        const initialIndex = savedIndex ? parseInt(savedIndex) % radioPlaylist.length : 0;
        playRadioTrack(initialIndex);
      }
    }

    function playRadioTrack(index) {
      if (radioPlaylist.length === 0) return;
      currentRadioIndex = index % radioPlaylist.length;
      localStorage.setItem('radioTrackIndex', currentRadioIndex);

      const player = document.getElementById('radioPlayer');
      player.src = radioPlaylist[currentRadioIndex].url;

      const savedTime = localStorage.getItem('radioCurrentTime');
      if (savedTime && parseFloat(savedTime) > 0) {
        player.currentTime = parseFloat(savedTime);
      }

      const isMuted = localStorage.getItem('radioMuted');
      if (isMuted === 'false') {
        player.muted = false;
        document.getElementById('radioAudioBtn').textContent = '🔊 Silenciar';
      } else {
        player.muted = true;
        document.getElementById('radioAudioBtn').textContent = '🔇 Activar Sonido';
      }

      player.play().catch(() => {});
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchTvPlaylist();
      fetchRadioPlaylist();

      const radioPlayer = document.getElementById('radioPlayer');
      const tvPlayer = document.getElementById('tvPlayer');

      // Pasar automáticamente al siguiente video cuando termina el actual
      tvPlayer.addEventListener('ended', () => {
        playVideo(currentVideoIndex + 1);
      });

      // Pasar al siguiente audio de la lista cuando termina
      radioPlayer.addEventListener('timeupdate', () => {
        if (radioPlayer.currentTime > 0) {
          localStorage.setItem('radioCurrentTime', radioPlayer.currentTime);
        }
      });

      radioPlayer.addEventListener('ended', () => {
        localStorage.setItem('radioCurrentTime', '0');
        playRadioTrack(currentRadioIndex + 1);
      });

      document.getElementById('authForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (document.getElementById('authUser').value === 'admin' && document.getElementById('authPass').value === 'coatetv') {
          isAdminAuthenticated = true;
          document.getElementById('authContainer').style.display = 'none';
          document.getElementById('adminPanelContent').style.display = 'grid';
          document.getElementById('adminView').classList.add('authenticated');
          loadStorageFiles();
        } else {
          alert('Usuario o contraseña incorrectos');
        }
      });

      document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const file = document.getElementById('mediaFile').files[0];
        const type = document.getElementById('mediaType').value;
        const bucket = type === 'video' ? 'videos' : 'audio';

        const status = document.getElementById('statusMessage');
        status.textContent = 'Subiendo archivo...';

        const { data, error } = await supabase.storage.from(bucket).upload(file.name, file, { upsert: true });

        if (error) {
          status.textContent = 'Error: ' + error.message;
        } else {
          status.textContent = '¡Subida exitosa!';
          document.getElementById('mediaFile').value = '';
          loadStorageFiles();
          if (type === 'video') fetchTvPlaylist();
          else fetchRadioPlaylist();
        }
      });
    });

    async function loadStorageFiles() {
      const vRes = await supabase.storage.from('videos').list();
      const aRes = await supabase.storage.from('audio').list();

      const vList = document.getElementById('adminVideoList');
      const aList = document.getElementById('adminAudioList');

      vList.innerHTML = vRes.data && vRes.data.length > 0 ? vRes.data.map(i => `<div class="file-item">📹 ${i.name}</div>`).join('') : '<p style="color:var(--text-dim)">Sin videos en el bucket</p>';
      aList.innerHTML = aRes.data && aRes.data.length > 0 ? aRes.data.map(i => `<div class="file-item">📻 ${i.name}</div>`).join('') : '<p style="color:var(--text-dim)">Sin audios en el bucket</p>';
    }
  </script>
</head>
<body>

  <nav>
    <div class="logo">CoateTV & Radio Digital</div>
    <div class="nav-tabs">
      <button id="tabPublic" class="tab-btn active" onclick="switchTab('public')">📺 Señal en Vivo</button>
      <button id="tabAdmin" class="tab-btn" onclick="switchTab('admin')">🔒 Admin Panel</button>
    </div>
  </nav>

  <main id="publicView" class="view-content active">
    <!-- SECCIÓN TV -->
    <section class="media-card">
      <h2 style="display: flex; justify-content: space-between; align-items: center;">
        Coate TV
        <span class="status-badge">🔴 AL AIRE</span>
      </h2>
      <div class="video-container">
        <video id="tvPlayer" autoplay muted playsinline></video>
        <div class="video-overlay-btn">
          <button id="tvAudioBtn" class="btn-audio-toggle" onclick="toggleTvAudio()">🔇 Activar Sonido</button>
        </div>
      </div>
    </section>

    <!-- SECCIÓN RADIO -->
    <section class="media-card">
      <h2 style="display: flex; justify-content: space-between; align-items: center;">
        Emisora de Radio
        <span class="status-badge" style="background:var(--success);">🔴 AL AIRE</span>
      </h2>
      <div class="audio-container">
        <audio id="radioPlayer" autoplay muted></audio>
        <span>Transmisión Digital en Vivo</span>
        <button id="radioAudioBtn" class="btn-audio-toggle" onclick="toggleRadioAudio()">🔇 Activar Sonido</button>
      </div>
    </section>
  </main>

  <main id="adminView" class="view-content">
    <div id="authContainer" class="media-card auth-card">
      <h2>Acceso Administrativo</h2>
      <form id="authForm">
        <div class="form-group"><label>Usuario</label><input type="text" id="authUser" required /></div>
        <div class="form-group"><label>Contraseña</label><input type="password" id="authPass" required /></div>
        <button type="submit" class="btn-submit">Ingresar</button>
      </form>
    </div>

    <div id="adminPanelContent" class="admin-panel-content">
      <section class="media-card">
        <h2>Cargar Nuevo Contenido</h2>
        <form id="uploadForm">
          <div class="form-group">
            <label>Tipo de Medio</label>
            <select id="mediaType">
              <option value="video">Video (.mp4)</option>
              <option value="audio">Audio (.mp3)</option>
            </select>
          </div>
          <div class="form-group">
            <input type="file" id="mediaFile" required />
          </div>
          <button type="submit" class="btn-submit">Subir Archivo</button>
        </form>
        <p id="statusMessage" style="margin-top: 10px; color: var(--text-dim);"></p>
      </section>

      <section class="media-card">
        <h2>Archivos Almacenados</h2>
        <h3>Videos</h3>
        <div id="adminVideoList"></div>
        <h3>Audios</h3>
        <div id="adminAudioList"></div>
      </section>
    </div>
  </main>

</body>
</html>
