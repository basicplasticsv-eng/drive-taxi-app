<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoateTV & Radio Digital</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #ff4757;
      --accent-hover: #ff6b81;
      --text: #ffffff;
      --text-dim: #aaa;
      --border: #333;
      --success: #2ed573;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    nav {
      background-color: #0a0a0a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
    }

    nav .logo {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--accent);
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .view-content {
      display: none;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .view-content.active {
      display: block;
    }

    /* Layout principal con banners publicitarios a los lados */
    .main-tv-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (min-width: 992px) {
      .main-tv-layout {
        grid-template-columns: 160px 1fr 160px;
      }
    }

    .ad-banner-side {
      background: #181818;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .ad-banner-side img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .media-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      margin-bottom: 20px;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
    }

    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Logo inamovible sobre el reproductor */
    .channel-logo-overlay {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      height: 45px;
      width: auto;
      opacity: 0.85;
      pointer-events: none;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.7));
    }

    .video-overlay-btn {
      position: absolute;
      bottom: 15px;
      right: 15px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }

    .btn-audio-toggle, .btn-fullscreen-toggle {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-audio-toggle:hover, .btn-fullscreen-toggle:hover {
      background-color: var(--accent-hover);
    }

    .audio-container {
      margin-top: 15px;
      padding: 20px;
      background-color: #000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      font-size: 0.8em;
      background: var(--accent);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: bold;
    }

    /* Estilos del panel de administración privado */
    .playlist-admin-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .playlist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #2a2a2a;
      border-radius: 6px;
      word-break: break-all;
    }

    .btn-delete {
      background-color: #ff3838;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: var(--text-dim); }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #2a2a2a;
      color: var(--text);
      box-sizing: border-box;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .auth-card { max-width: 400px; margin: 40px auto; width: 100%; }
    
    .admin-panel-content { 
      display: none; 
      width: 100%; 
      gap: 20px; 
    }

    @media (min-width: 768px) {
      .admin-panel-content.authenticated { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
      }
    }
  </style>

  <script>
    // Inicialización de la lista de IDs de Archive.org almacenada localmente en el navegador
    let archiveItems = JSON.parse(localStorage.getItem('coatetv_items')) || [
      'videoplayback-4_20260904',
      'nuevo-sitio-el-rosario_202609'
    ];

    let playlist = [];
    let currentVideoIndex = 0;
    let isAdminAuthenticated = false;

    window.switchTab = function(tabName) {
      document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      if(tabName === 'public') {
        document.getElementById('publicView').classList.add('active');
        document.getElementById('tabPublic').classList.add('active');
      } else {
        document.getElementById('adminView').classList.add('active');
        document.getElementById('tabAdmin').classList.add('active');
        if (isAdminAuthenticated) renderAdminList();
      }
    };

    window.toggleTvAudio = function(e) {
      if(e) e.stopPropagation();
      const video = document.getElementById('tvPlayer');
      const btn = document.getElementById('tvAudioBtn');
      if (video.muted) {
        video.muted = false;
        btn.textContent = '🔊 Silenciar';
      } else {
        video.muted = true;
        btn.textContent = '🔇 Activar Sonido';
      }
    };

    window.toggleFullscreen = function(e) {
      if(e) e.stopPropagation();
      const container = document.getElementById('tvContainer');
      const video = document.getElementById('tvPlayer');

      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) container.requestFullscreen();
        else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    };

    // Consulta la API de Archive.org para cada ID configurado
    async function loadTvPlaylist() {
      playlist = [];
      for (const itemId of archiveItems) {
        try {
          const res = await fetch(`https://archive.org/metadata/${itemId}`);
          const data = await res.json();
          if (data && data.files) {
            const mp4Files = data.files.filter(f => f.format === 'MPEG4' || f.name.endsWith('.mp4'));
            mp4Files.forEach(file => {
              playlist.push({
                title: file.title || file.name,
                url: `https://${data.server}${data.dir}/${file.name}`,
                duration: parseFloat(file.length) || 120
              });
            });
          }
        } catch (e) {
          console.error('Error cargando item:', itemId, e);
        }
      }

      if (playlist.length > 0) {
        syncTvStream();
      }
    }

    function syncTvStream() {
      if (playlist.length === 0) return;
      const totalPlaylistDuration = playlist.reduce((sum, item) => sum + item.duration, 0);
      const nowInSeconds = Math.floor(Date.now() / 1000);
      let currentPositionInCycle = nowInSeconds % totalPlaylistDuration;
      
      let accumTime = 0;
      let targetIndex = 0;
      let targetTimeOffset = 0;

      for (let i = 0; i < playlist.length; i++) {
        if (currentPositionInCycle >= accumTime && currentPositionInCycle < accumTime + playlist[i].duration) {
          targetIndex = i;
          targetTimeOffset = currentPositionInCycle - accumTime;
          break;
        }
        accumTime += playlist[i].duration;
      }

      currentVideoIndex = targetIndex;
      const player = document.getElementById('tvPlayer');
      player.src = playlist[currentVideoIndex].url;

      player.addEventListener('loadedmetadata', () => {
        if (targetTimeOffset < player.duration) {
          player.currentTime = targetTimeOffset;
        }
        player.play().catch(() => {});
      }, { once: true });
    }

    function playNextVideo() {
      if (playlist.length === 0) return;
      currentVideoIndex = (currentVideoIndex + 1) % playlist.length;
      const player = document.getElementById('tvPlayer');
      player.src = playlist[currentVideoIndex].url;
      player.play().catch(() => {});
    }

    function renderAdminList() {
      const container = document.getElementById('adminVideoList');
      if (archiveItems.length === 0) {
        container.innerHTML = '<p style="color:var(--text-dim)">No hay publicaciones de Archive.org agregadas.</p>';
        return;
      }

      container.innerHTML = archiveItems.map((item, index) => `
        <div class="playlist-item">
          <div>
            <strong>📂 ID: ${item}</strong><br>
            <small style="color:var(--text-dim)">🔗 https://archive.org/details/${item}</small>
          </div>
          <button class="btn-delete" onclick="removeArchiveItem(${index})">🗑 Eliminar</button>
        </div>
      `).join('');
    }

    window.removeArchiveItem = function(index) {
      if (!confirm('¿Deseas remover este ID de la programación?')) return;
      archiveItems.splice(index, 1);
      localStorage.setItem('coatetv_items', JSON.stringify(archiveItems));
      renderAdminList();
      loadTvPlaylist();
    };

    window.logoutAdmin = function() {
      isAdminAuthenticated = false;
      document.getElementById('authContainer').style.display = 'block';
      const panel = document.getElementById('adminPanelContent');
      panel.style.display = 'none';
      panel.classList.remove('authenticated');
      document.getElementById('authUser').value = '';
      document.getElementById('authPass').value = '';
    };

    // Extrae el ID del enlace si pegas la URL completa o solo el ID
    function extractArchiveId(input) {
      input = input.trim();
      if (input.includes('archive.org/details/')) {
        const parts = input.split('archive.org/details/');
        return parts[1].split('/')[0].split('?')[0];
      }
      return input;
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadTvPlaylist();

      const tvPlayer = document.getElementById('tvPlayer');
      tvPlayer.addEventListener('ended', playNextVideo);

      // Autenticación de Administración
      document.getElementById('authForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (document.getElementById('authUser').value === 'admin' && document.getElementById('authPass').value === 'coatetv') {
          isAdminAuthenticated = true;
          document.getElementById('authContainer').style.display = 'none';
          const panel = document.getElementById('adminPanelContent');
          panel.style.display = 'grid';
          panel.classList.add('authenticated');
          renderAdminList();
        } else {
          alert('Usuario o contraseña incorrectos');
        }
      });

      // Formulario para agregar publicaciones de Archive.org
      document.getElementById('addVideoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!isAdminAuthenticated) return;

        const rawInput = document.getElementById('archiveInput').value;
        const itemId = extractArchiveId(rawInput);

        if (!itemId) {
          alert('Ingresa una URL o un ID válido de Archive.org');
          return;
        }

        if (!archiveItems.includes(itemId)) {
          archiveItems.push(itemId);
          localStorage.setItem('coatetv_items', JSON.stringify(archiveItems));
          document.getElementById('statusMessage').textContent = '¡Cargado con éxito!';
          document.getElementById('archiveInput').value = '';
          renderAdminList();
          await loadTvPlaylist();
        } else {
          alert('Este contenido ya está en la lista.');
        }
      });
    });
  </script>
</head>
<body>

  <nav>
    <div class="logo">CoateTV & Radio Digital</div>
    <div class="nav-tabs">
      <button id="tabPublic" class="tab-btn active" onclick="switchTab('public')">📺 Señal en Vivo</button>
      <button id="tabAdmin" class="tab-btn" onclick="switchTab('admin')">🔒 Admin Panel</button>
    </div>
  </nav>

  <main id="publicView" class="view-content active">
    <div class="main-tv-layout">
      
      <!-- PUBLICIDAD IZQUIERDA -->
      <aside class="ad-banner-side">
        <p>Espacio Publicitario</p>
        <img src="https://via.placeholder.com/160x600?text=Tu+Anuncio+Aqui" alt="Publicidad Izquierda">
      </aside>

      <!-- REPRODUCTOR DE TV Y RADIO -->
      <div>
        <section class="media-card">
          <h2 style="display: flex; justify-content: space-between; align-items: center;">
            Coate TV
            <span class="status-badge">🔴 EN VIVO 24/7</span>
          </h2>
          <div class="video-container" id="tvContainer" onclick="toggleFullscreen(event)">
            <img src="https://i.ibb.co/WrtpwB1/logo.png" alt="Logo Canal" class="channel-logo-overlay" />
            <video id="tvPlayer" autoplay muted playsinline></video>
            <div class="video-overlay-btn">
              <button id="tvAudioBtn" class="btn-audio-toggle" onclick="toggleTvAudio(event)">🔇 Activar Sonido</button>
              <button class="btn-fullscreen-toggle" onclick="toggleFullscreen(event)">⛶ Expandir</button>
            </div>
          </div>
        </section>

        <section class="media-card">
          <h2 style="display: flex; justify-content: space-between; align-items: center;">
            Emisora de Radio
            <span class="status-badge" style="background:var(--success);">🔴 EN VIVO</span>
          </h2>
          <div class="audio-container">
            <audio id="radioPlayer" autoplay muted></audio>
            <span>Transmisión Digital en Vivo</span>
          </div>
        </section>
      </div>

      <!-- PUBLICIDAD DERECHA -->
      <aside class="ad-banner-side">
        <p>Espacio Publicitario</p>
        <img src="https://via.placeholder.com/160x600?text=Tu+Anuncio+Aqui" alt="Publicidad Derecha">
      </aside>

    </div>
  </main>

  <main id="adminView" class="view-content">
    <!-- Formulario de Login -->
    <div id="authContainer" class="media-card auth-card">
      <h2>Acceso Administrativo</h2>
      <p style="color:var(--text-dim); font-size:0.9rem;">Ingresa tus credenciales para administrar el contenido.</p>
      <form id="authForm">
        <div class="form-group"><label>Usuario</label><input type="text" id="authUser" required /></div>
        <div class="form-group"><label>Contraseña</label><input type="password" id="authPass" required /></div>
        <button type="submit" class="btn-submit">Ingresar al Panel</button>
      </form>
    </div>

    <!-- PANEL PRIVADO -->
    <div id="adminPanelContent" class="admin-panel-content">
      
      <!-- SECCIÓN 1: AGREGAR CONTENIDO DE ARCHIVE.ORG -->
      <section class="media-card">
        <h2>Agregar Contenido de Archive.org</h2>
        <form id="addVideoForm">
          <div class="form-group">
            <label>Enlace o ID del item de Archive.org</label>
            <input type="text" id="archiveInput" placeholder="Ej: https://archive.org/details/nuevo-sitio-el-rosario_202609" required />
          </div>
          <button type="submit" class="btn-submit">➕ Vincular a la Transmisión</button>
        </form>
        <p id="statusMessage" style="margin-top: 10px; color: var(--success); font-weight: bold;"></p>
      </section>

      <!-- SECCIÓN 2: CONTROL DE ARCHIVOS CONFIGURADOS -->
      <section class="media-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2>Publicaciones Vinculadas</h2>
          <button onclick="logoutAdmin()" style="background:#444; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Cerrar Sesión</button>
        </div>
        <div id="adminVideoList" class="playlist-admin-list"></div>
      </section>

    </div>
  </main>

</body>
</html>
