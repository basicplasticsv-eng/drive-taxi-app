<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoateTV & Radio Digital</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #ff4757;
      --accent-hover: #ff6b81;
      --text: #ffffff;
      --text-dim: #aaa;
      --border: #333;
      --success: #2ed573;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    nav {
      background-color: #0a0a0a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
    }

    nav .logo {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--accent);
    }

    .view-content {
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Layout principal con banners publicitarios a los lados */
    .main-tv-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (min-width: 992px) {
      .main-tv-layout {
        grid-template-columns: 160px 1fr 160px;
      }
    }

    .ad-banner-side {
      background: #181818;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .ad-banner-side img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .media-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      margin-bottom: 20px;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
    }

    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Logo fijo sobre el reproductor */
    .channel-logo-overlay {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      height: 45px;
      width: auto;
      opacity: 0.85;
      pointer-events: none;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.7));
    }

    .video-overlay-btn {
      position: absolute;
      bottom: 15px;
      right: 15px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }

    .btn-audio-toggle, .btn-fullscreen-toggle {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-audio-toggle:hover, .btn-fullscreen-toggle:hover {
      background-color: var(--accent-hover);
    }

    .audio-container {
      margin-top: 15px;
      padding: 20px;
      background-color: #000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      font-size: 0.8em;
      background: var(--accent);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: bold;
    }

    .playlist-info {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--text-dim);
    }
  </style>

  <script>
    // Identificador de tu Item/Carpeta de Archive.org
    const ARCHIVE_ITEM_ID = 'videoplayback-4_20260904'; 

    let playlist = [];
    let currentVideoIndex = 0;

    window.toggleTvAudio = function(e) {
      if(e) e.stopPropagation();
      const video = document.getElementById('tvPlayer');
      const btn = document.getElementById('tvAudioBtn');
      if (video.muted) {
        video.muted = false;
        btn.textContent = '🔊 Silenciar';
      } else {
        video.muted = true;
        btn.textContent = '🔇 Activar Sonido';
      }
    };

    window.toggleFullscreen = function(e) {
      if(e) e.stopPropagation();
      const container = document.getElementById('tvContainer');
      const video = document.getElementById('tvPlayer');

      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) container.requestFullscreen();
        else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    };

    // Obtener los videos automáticamente desde la API de Archive.org
    async function fetchArchivePlaylist() {
      try {
        const response = await fetch(`https://archive.org/metadata/${ARCHIVE_ITEM_ID}`);
        const data = await response.json();
        
        if (data && data.files) {
          const server = data.server;
          const dir = data.dir;

          // Filtra solo los archivos de video formato MP4
          playlist = data.files
            .filter(file => file.format === 'MPEG4' || file.name.endsWith('.mp4'))
            .map(file => ({
              title: file.title || file.name,
              url: `https://${server}${dir}/${file.name}`,
              duration: parseFloat(file.length) || 120
            }));

          if (playlist.length > 0) {
            document.getElementById('playlistCount').textContent = `Videos cargados desde Archive.org: ${playlist.length}`;
            syncTvStream();
          } else {
            document.getElementById('playlistCount').textContent = 'No se encontraron videos .mp4 en la carpeta de Archive.org.';
          }
        }
      } catch (err) {
        console.error('Error leyendo Archive.org:', err);
        document.getElementById('playlistCount').textContent = 'Error al conectar con Archive.org.';
      }
    }

    function syncTvStream() {
      if (playlist.length === 0) return;

      const totalPlaylistDuration = playlist.reduce((sum, item) => sum + item.duration, 0);
      const nowInSeconds = Math.floor(Date.now() / 1000);
      let currentPositionInCycle = nowInSeconds % totalPlaylistDuration;
      
      let accumTime = 0;
      let targetIndex = 0;
      let targetTimeOffset = 0;

      for (let i = 0; i < playlist.length; i++) {
        if (currentPositionInCycle >= accumTime && currentPositionInCycle < accumTime + playlist[i].duration) {
          targetIndex = i;
          targetTimeOffset = currentPositionInCycle - accumTime;
          break;
        }
        accumTime += playlist[i].duration;
      }

      currentVideoIndex = targetIndex;
      const player = document.getElementById('tvPlayer');
      player.src = playlist[currentVideoIndex].url;

      player.addEventListener('loadedmetadata', () => {
        if (targetTimeOffset < player.duration) {
          player.currentTime = targetTimeOffset;
        }
        player.play().catch(() => {});
      }, { once: true });
    }

    function playNextVideo() {
      if (playlist.length === 0) return;
      currentVideoIndex = (currentVideoIndex + 1) % playlist.length;
      const player = document.getElementById('tvPlayer');
      player.src = playlist[currentVideoIndex].url;
      player.play().catch(() => {});
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchArchivePlaylist();

      const tvPlayer = document.getElementById('tvPlayer');
      tvPlayer.addEventListener('ended', playNextVideo);
    });
  </script>
</head>
<body>

  <nav>
    <div class="logo">CoateTV & Radio Digital</div>
  </nav>

  <main class="view-content">
    <div class="main-tv-layout">
      
      <!-- PUBLICIDAD IZQUIERDA -->
      <aside class="ad-banner-side">
        <p>Espacio Publicitario</p>
        <img src="https://via.placeholder.com/160x600?text=Tu+Anuncio+Aqui" alt="Publicidad Izquierda">
      </aside>

      <!-- REPRODUCTOR DE TV Y RADIO -->
      <div>
        <section class="media-card">
          <h2 style="display: flex; justify-content: space-between; align-items: center;">
            Coate TV
            <span class="status-badge">🔴 EN VIVO 24/7</span>
          </h2>
          <div class="video-container" id="tvContainer" onclick="toggleFullscreen(event)">
            <!-- LOGO FIJO EN PANTALLA -->
            <img src="https://i.ibb.co/WrtpwB1/logo.png" alt="Logo Canal" class="channel-logo-overlay" />
            
            <video id="tvPlayer" autoplay muted playsinline></video>
            
            <div class="video-overlay-btn">
              <button id="tvAudioBtn" class="btn-audio-toggle" onclick="toggleTvAudio(event)">🔇 Activar Sonido</button>
              <button class="btn-fullscreen-toggle" onclick="toggleFullscreen(event)">⛶ Expandir</button>
            </div>
          </div>
          <div id="playlistCount" class="playlist-info">Conectando con Archive.org...</div>
        </section>

        <section class="media-card">
          <h2 style="display: flex; justify-content: space-between; align-items: center;">
            Emisora de Radio
            <span class="status-badge" style="background:var(--success);">🔴 EN VIVO</span>
          </h2>
          <div class="audio-container">
            <audio id="radioPlayer" autoplay muted></audio>
            <span>Transmisión Digital en Vivo</span>
          </div>
        </section>
      </div>

      <!-- PUBLICIDAD DERECHA -->
      <aside class="ad-banner-side">
        <p>Espacio Publicitario</p>
        <img src="https://via.placeholder.com/160x600?text=Tu+Anuncio+Aqui" alt="Publicidad Derecha">
      </aside>

    </div>
  </main>

</body>
</html>
